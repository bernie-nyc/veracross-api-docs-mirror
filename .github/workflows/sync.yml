name: sync-veracross-docs

# Keeps this mirror current WITHOUT a blind full re-mirror every run.
# First it checks the three Veracross changelog endpoints (Authorization-API,
# Data-API, Files-API). A new entry in any of the three means the corresponding
# API changed, so it then pulls a full sync, commits, and pushes. If all three
# are unchanged, it skips (fast, no commit, no push).

on:
  schedule:
    # daily around 06:17 UTC (off-round on purpose to dodge the :00 crowd)
    - cron: "17 6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the mirror
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --quiet pyyaml

      - name: Check the three changelog endpoints for new content
        id: check
        # exits 0 with changed=true|false; exits 1 on network errors so a
        # failure is loud instead of a silent skip
        run: python scripts/check_changelogs.py

      - name: Pull a full sync (only when a changelog changed)
        if: steps.check.outputs.changed == 'true'
        run: python mirror.py --out . --concurrency 8

      - name: Commit and push
        if: steps.check.outputs.changed == 'true'
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "Re-mirror produced no file changes; nothing to push."
          else
            git commit -m "sync: re-mirror Veracross API docs ($(date -u +%F))"
            git push
          fi
