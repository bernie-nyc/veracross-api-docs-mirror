      description: Return collection of lineItems.
      operationId: getAllLineItems
      parameters:
      - name: filter
        in: query
        description: 'Query Filter in one of the following formats:<br><ul><li>?filter={data field}{predicate}{value}</li><li>?filter={data field}{predicate}{value} {logical} {data field}{predicate}{value}</li></ul>

          where {predicate} is one of [=, !=, >, >=, <, <=, ~]<br>

          and {logical} is one of [AND, OR]'
        schema:
          type: string
      - name: limit
        in: query
        description: The number of results to return.
        schema:
          type: integer
          minimum: 1
      - name: offset
        in: query
        description: The index of the first record to return. (zero indexed)
        schema:
          type: integer
          minimum: 0
      - name: sort
        in: query
        description: Designates the field used to sort the list, any data field may be sorted on (nested fields can be accessed with "." notation, i.e. "course.sourcedId").
        schema:
          type: string
      - name: orderBy
        in: query
        description: May be used after a sort query parameter. Designates the sort direction, "asc" or "desc".
        schema:
          type: string
          default: asc
      responses:
        '200':
          description: OK - New resource has been created.
          content:
            application/json:
              schema:
                type: object
                properties:
                  lineItems:
                    type: array
                    items:
                      type: object
                      properties:
                        sourcedId:
                          type: string
                          description: Line Item Oneroster Access Name
                        status:
