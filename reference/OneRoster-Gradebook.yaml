                      required:
                      - sourcedId
                      - status
                      - dateLastModified
                      - title
                required:
                - category
        '400':
          description: Bad Request - the Request was invalid and cannot be served.
          content:
            application/json:
              schema:
                type: object
                description: The error payload follows the prevailing LIS practice of specifying a CodeMajor, Severity, CodeMinor and description.
                properties:
                  statusInfo:
                    type: object
                    properties:
                      imsx_codeMajor:
                        type: string
                        description: Code Major
                        enum:
                        - success
                        - failure
                      imsx_codeMinor:
                        type: string
                        description: Code Minor
                        enum:
                        - full success
                        - unknown object
                        - invalid data
