    put:
      tags:
      - Categories
      summary: Create Categories
      description: This is a modified version of the OneRoster standard where the sourcedId is ommitted from the path, and the created object is returned in the response body for convenience.
      operationId: putCategory
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                category:
                  type: object
                  properties:
                    sourcedId:
                      type: string
                      description: Oneroster Category Access Name
                    title:
                      type: string
                      description: Description
                      maxLength: 50
                  required:
                  - title
              required:
              - category
      responses:
        '201':
          description: OK - New resource has been created.
          content:
            application/json:
              schema:
                type: object
                properties:
                  category:
                    type: array
                    items:
                      type: object
                      properties:
                        sourcedId:
                          type: string
                          description: Oneroster Category Access Name
                        status:
                          type: string
                          description: OneRoster Category Status
                          readOnly: true
                        dateLastModified:
                          type: string
                          description: Date Last Modified
                        title:
                          type: string
