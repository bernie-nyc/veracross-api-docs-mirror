                type: object
                properties:
                  data:
                    type: object
                    properties:
                      person_id:
                        type: integer
                        description: Person ID
                      status:
                        type: integer
                        description: API Upload Status
                      error:
                        type: string
                        description: API Upload Error
                      download_url:
                        type: string
                        description: 'Person Photo URL/W Expiration


                          This URL is private and expires 24 hours after the API request is completed.'
                        readOnly: true
                      notes:
                        type: string
                        description: Notes
                      last_modified_date:
                        type: string
                        format: date-time
                        description: Last Modified Date
                        readOnly: true
                    required:
                    - id
                    - person_id
                    - status
                    - error
                    - download_url
                    - notes
                    - last_modified_date
                  value_lists:
                    type: array
                    description: Present only with header `X-API-Value-Lists = include`
                    readOnly: true
                    items:
                      type: object
                      properties:
                        fields:
                          type: array
                          description: An array of field names from `data` that this value list goes with
                          items:
                            type: string
                            enum:
                            - status
                        items:
                          type: array
                          description: An array of value list items whose `id` field matches the value in the response data
                          items:
                            type: object
                            properties:
                              description:
                                type: string
                              category:
                                type: integer
                              sort_key:
                                type: integer
                              obsolete:
                                type: boolean
                            required:
                            - id
                            - description
                            - sort_key
                        categories:
                          type: array
                          description: An array of "category" objects, which allow you to partition the value list items according to their category field
                          items:
                            type: object
                            properties:
                              description:
                                type: string
                              sort_key:
                                type: integer
                            required:
                            - id
                            - description
                            - sort_key
                      required:
                      - fields
