                      type: integer
                      description: Record ID
                    invoice_number:
                      type: string
                      description: Invoice Number
                      maxLength: 30
                    name:
                      type: string
                      description: Name
                      maxLength: 1000
                    description:
                      type: string
                      description: Description (Text)
                      maxLength: 1000
                    notes:
