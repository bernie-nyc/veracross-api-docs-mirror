      summary: 'Create Finance: AP Invoice Files'
      operationId: create_finance_ap_invoice_files
      parameters:
      - name: invoice_id
        in: path
        description: Record ID
        required: true
        schema:
          type: integer
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  type: object
                  properties:
