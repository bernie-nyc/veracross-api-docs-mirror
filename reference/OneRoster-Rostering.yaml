    get:
      tags:
      - Terms-Classes
      summary: List Term's Classes
      description: Return the collection of classes that are taught in this term.
      operationId: getClassesForTerm
      parameters:
      - name: term_id
        in: path
        description: Term OneRoster Access Name
        required: true
        schema:
          type: string
      - name: filter
        in: query
        description: 'Query Filter in one of the following formats:<br><ul><li>?filter={data field}{predicate}{value}</li><li>?filter={data field}{predicate}{value} {logical} {data field}{predicate}{value}</li></ul>

          where {predicate} is one of [=, !=, >, >=, <, <=, ~]<br>

          and {logical} is one of [AND, OR]'
        schema:
          type: string
      - name: limit
        in: query
        description: The number of results to return.
        schema:
          type: integer
          minimum: 1
      - name: offset
        in: query
        description: The index of the first record to return. (zero indexed)
        schema:
          type: integer
          minimum: 0
