          where {predicate} is one of [=, !=, >, >=, <, <=, ~]<br>

          and {logical} is one of [AND, OR]'
        schema:
          type: string
      - name: limit
        in: query
        description: The number of results to return.
        schema:
          type: integer
          minimum: 1
      - name: offset
        in: query
        description: The index of the first record to return. (zero indexed)
        schema:
          type: integer
          minimum: 0
      - name: sort
        in: query
        description: Designates the field used to sort the list, any data field may be sorted on (nested fields can be accessed with "." notation, i.e. "course.sourcedId").
        schema:
          type: string
      - name: orderBy
        in: query
        description: May be used after a sort query parameter. Designates the sort direction, "asc" or "desc".
        schema:
          type: string
          default: asc
      responses:
        '200':
          description: OK - It was possible to read the collection / resource.
          content:
            application/json:
              schema:
                type: object
                properties:
                  users:
                    type: array
                    items:
                      type: object
                      properties:
                        sourcedId:
                          type: string
                          description: OneRoster Access Name
                          readOnly: true
                        status:
                          type: string
                          description: OneRoster Status
                          readOnly: true
                        dateLastModified:
                          type: string
                          description: Date Last Modified
                          readOnly: true
                        username:
                          type: string
                          description: Username
                        enabledUser:
                          type: string
                          description: OneRoster Enabled User
                          readOnly: true
                        givenName:
                          type: string
                          description: First Name
                        familyName:
                          type: string
                          description: Last Name
                        middleName:
                          type: string
                          description: Middle Name
                        preferredFirstName:
                          type: string
                          description: Preffered First Name
                        role:
                          type: string
                          description: OneRoster Role
                          readOnly: true
                        identifier:
                          type: string
                          description: Person ID - Read Only
                          readOnly: true
                        email:
                          type: string
                          description: 'Email 1


                            This should be used as the &quot;Preferred&quot; email for email blasts and other electronic correspondence.'
                        phone:
                          type: string
                          description: Mobile Phone
                        agents:
